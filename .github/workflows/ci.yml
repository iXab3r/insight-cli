name: offline-checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:package
      - name: Artifact verification performance smoke
        run: |
          npm install --prefix "$RUNNER_TEMP/insight-baseline" --ignore-scripts --no-audit --no-fund @eyeauras/insight-cli@0.2.4
          node scripts/performance/hashing.mjs --baseline "$RUNNER_TEMP/insight-baseline/node_modules/@eyeauras/cli-factory-ipc/dist/src/package-build.js" --candidate "$GITHUB_WORKSPACE/node_modules/@eyeauras/cli-factory-ipc/dist/src/package-build.js" --entry "$RUNNER_TEMP/insight-baseline/node_modules/@eyeauras/insight-cli/dist/src/bin.js" --output "$RUNNER_TEMP/hash-performance.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifact-verification-performance
          path: ${{ runner.temp }}/hash-performance.json
      - run: git diff --exit-code
  windows-java-arguments:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Real java and javac long-classpath regression
        shell: pwsh
        run: |
          $env:INSIGHT_TEST_JDK = Join-Path $env:JAVA_HOME 'bin'
          node --test skills/ghidra-coordinator/dist/tests/java-arguments.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: git diff --exit-code
