name: Release npm
run-name: Release npm from ${{ github.ref_name }} (publish=${{ inputs.publish }})

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked package version to npm latest
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: insight-npm-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Publish only from main
        env:
          PUBLISH: ${{ inputs.publish }}
          NPM_RELEASE_READY: ${{ vars.NPM_RELEASE_READY }}
        run: |
          if [[ "$PUBLISH" == true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Publish from main. Other refs can run with publish unchecked.' >&2
            exit 1
          fi
          if [[ "$PUBLISH" == true && "$NPM_RELEASE_READY" != true ]]; then
            echo 'Publication setup is incomplete. Configure npm-release / npm trusted publishing, then set NPM_RELEASE_READY=true. Build-only is available.' >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:package
      - run: npm run pack:cli
      - name: Bind the inspected archive to its source commit
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          git diff --exit-code
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile, mkdir, copyFile, writeFile, appendFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const pkg=JSON.parse(await readFile('skills/ghidra-coordinator/package.json','utf8'));
          assert.equal(pkg.name,'@eyeauras/insight-cli');
          assert.match(pkg.version,/^\d+\.\d+\.\d+$/,'Only stable committed versions publish as latest');
          const archive=`artifacts/eyeauras-insight-cli-${pkg.version}.tgz`;
          const bytes=await readFile(archive);
          const manifest={schema:1,name:pkg.name,version:pkg.version,
            sourceCommit:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),
            sourceRef:process.env.SOURCE_REF,bytes:bytes.length,
            sha256:createHash('sha256').update(bytes).digest('hex'),
            integrity:'sha512-'+createHash('sha512').update(bytes).digest('base64')};
          await mkdir('release',{recursive:true});
          await copyFile(archive,'release/package.tgz');
          await writeFile('release/release.json',JSON.stringify(manifest,null,2)+'\n');
          await appendFile(process.env.GITHUB_STEP_SUMMARY,
            `### Built ${pkg.name}@${pkg.version}\n\nSource: \`${manifest.sourceCommit}\`\n\nSHA-256: \`${manifest.sha256}\`\n\nDownload the npm-package artifact for the exact archive and receipt.\n`);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - name: Publish once using OIDC and verify registry integrity
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile,writeFile,appendFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {spawnSync} from 'node:child_process';
          import {setTimeout} from 'node:timers/promises';
          const manifest=JSON.parse(await readFile('release/release.json','utf8'));
          assert.equal(manifest.schema,1);
          assert.equal(manifest.name,'@eyeauras/insight-cli');
          assert.match(manifest.version,/^\d+\.\d+\.\d+$/);
          const bytes=await readFile('release/package.tgz');
          assert.equal(createHash('sha256').update(bytes).digest('hex'),manifest.sha256);
          assert.equal('sha512-'+createHash('sha512').update(bytes).digest('base64'),manifest.integrity);
          async function readTags(){
            const response=await fetch('https://registry.npmjs.org/-/package/@eyeauras%2finsight-cli/dist-tags',{signal:AbortSignal.timeout(30000)});
            assert.equal(response.status,200);
            return response.json();
          }
          const beforeTags=await readTags();
          assert.match(beforeTags.latest,/^\d+\.\d+\.\d+$/,'Inspect the unexpected current latest before publishing');
          const current=beforeTags.latest.split('.').map(BigInt),next=manifest.version.split('.').map(BigInt);
          const different=next.findIndex((part,index)=>part!==current[index]);
          assert.ok(different<0||next[different]>current[different],'Refusing to publish a version below current latest');
          const url=`https://registry.npmjs.org/@eyeauras%2finsight-cli/${manifest.version}`;
          async function inspect(){
            const response=await fetch(url,{signal:AbortSignal.timeout(30000)});
            if(response.status===404)return null;
            assert.equal(response.status,200,`Registry returned ${response.status}`);
            const data=await response.json();
            assert.equal(data.dist.integrity,manifest.integrity,
              'This version already contains different bytes. Commit a new version; never overwrite it.');
            return data;
          }
          let published=await inspect(),status=0;
          if(!published){
            const result=spawnSync('npm',['publish','release/package.tgz','--access','public',
              '--tag','latest','--ignore-scripts','--provenance'],{stdio:'inherit',timeout:180000});
            status=result.status??1;
          }
          // A lost response is resolved by readback, never by a second publication.
          for(let attempt=0;!published&&attempt<30;attempt++){
            if(attempt)await setTimeout(10000);
            published=await inspect();
          }
          assert.ok(published,`No matching registry version after publication (npm exit ${status}). Check npm Trusted Publisher for release-npm.yml / environment npm-release.`);
          const tags=await readTags();
          assert.equal(tags.latest,manifest.version,'Identical version exists, but latest points elsewhere; no tag was changed automatically');
          await writeFile('release/registry.json',JSON.stringify({name:manifest.name,version:manifest.version,
            sourceCommit:manifest.sourceCommit,integrity:published.dist.integrity,tarball:published.dist.tarball,
            latest:tags.latest,attestations:published.dist.attestations??null},null,2)+'\n');
          await appendFile(process.env.GITHUB_STEP_SUMMARY,
            `### Published and read back ${manifest.name}@${manifest.version}\n\nRegistry integrity matches the build artifact. latest=${tags.latest}.\n`);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: npm-registry-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/registry.json
          if-no-files-found: error

  verify-global:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - name: Install the exact registry version globally and exercise public CLI
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile,writeFile,appendFile} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          import {join} from 'node:path';
          const manifest=JSON.parse(await readFile('release/release.json','utf8'));
          assert.equal(manifest.name,'@eyeauras/insight-cli');
          assert.match(manifest.version,/^\d+\.\d+\.\d+$/);
          const prefix=join(process.env.RUNNER_TEMP,'global-cli');
          execFileSync('npm',['install','--global','--prefix',prefix,'--cache',join(process.env.RUNNER_TEMP,'fresh-npm-cache'),
            '--userconfig','/dev/null','--registry','https://registry.npmjs.org/',`${manifest.name}@${manifest.version}`],{stdio:'inherit'});
          const cli=join(prefix,'bin/insight-cli');
          const call=args=>execFileSync(cli,args,{encoding:'utf8',timeout:60000});
          assert.equal(call(['--version']).trim(),manifest.version);
          assert.match(call(['--help']),/ghidra/);
          const skill=JSON.parse(call(['skill','insight-re','--json']));
          assert.ok((await readFile(skill.path,'utf8')).includes(`Insight RE ${manifest.version}`));
          call(['profile','create','ci-release-check','--json']);
          call(['--profile','ci-release-check','permissions','grant','Update','--json']);
          const input=join(process.env.RUNNER_TEMP,'release-smoke.txt');
          await writeFile(input,'Published CLI checkpoint\n');
          const saved=JSON.parse(call(['--profile','ci-release-check','artifacts','save',input,'--json']));
          assert.equal(saved.state,'saved');
          assert.equal(await readFile(saved.path,'utf8'),'Published CLI checkpoint\n');
          const status=JSON.parse(call(['--profile','ci-release-check','ghidra','status','--json']));
          assert.equal(status.processes.length,0);
          call(['--profile','ci-release-check','ipc-server','stop']);
          await appendFile(process.env.GITHUB_STEP_SUMMARY,
            `### Registry global install passed\n\nVersion, help, installed RE skill, artifacts save and passive Ghidra status verified. Native Ghidra acceptance is a separate gate.\n`);
          NODE
