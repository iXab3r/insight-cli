name: toolbox-windows-feasibility
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/toolbox-audit-windows.yml'
      - 'scripts/toolbox/audit-windows.ps1'
permissions:
  contents: read
jobs:
  native-feasibility:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.303'
      - name: Probe owned Windows automation surfaces
        shell: pwsh
        run: ./scripts/toolbox/audit-windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolbox-windows-feasibility
          path: toolbox-audit-windows.json
          if-no-files-found: error
