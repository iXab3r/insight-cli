name: toolbox-strace-linux
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/toolbox-strace-linux.yml'
      - 'scripts/toolbox/build-strace-linux.py'
permissions:
  contents: read
jobs:
  build-and-owned-ptrace:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the exact source twice and verify owned syscall/lifetime behavior
        run: python3 scripts/toolbox/build-strace-linux.py "$RUNNER_TEMP/insight-strace-distribution"
        env:
          INSIGHT_NATIVE_DISPOSABLE: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: toolbox-strace-distribution
          path: ${{ runner.temp }}/insight-strace-distribution/*
          if-no-files-found: error
